<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução à Inteligência Artificial- Fundamentos e Aplicações do Amanhã - Noteb - Quiz Export</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg: #f6f1e7;
            --bg-deep: #efe4d6;
            --ink: #171717;
            --muted: #5b5b5b;
            --accent: #d3542c;
            --accent-light: #ff8f5a;
            --accent-dark: #b14320;
            --teal: #1f6f78;
            --card: #fff7ef;
            --stroke: #e3d6c5;
            --shadow: 0 18px 40px rgba(23, 23, 23, 0.12);
            --radius-sm: 10px;
            --radius-md: 12px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            --radius-2xl: 22px;
            --space-1: 6px;
            --space-2: 8px;
            --space-3: 10px;
            --space-4: 12px;
            --space-5: 14px;
            --space-6: 16px;
            --space-7: 18px;
            --space-8: 20px;
            --space-9: 24px;
            --space-10: 32px;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'IBM Plex Sans', sans-serif;
            --error: #b54832;
        }

        body {
            font-family: var(--font-body);
            background:
                radial-gradient(240px 140px at 10% -10%, #ffd2b9 0%, transparent 70%),
                radial-gradient(220px 160px at 90% 0%, #cfe7e6 0%, transparent 65%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
            color: var(--ink);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
            padding: var(--space-10) var(--space-8);
            box-sizing: border-box;
            background: var(--card);
            border-radius: var(--radius-2xl);
            border: 1px solid var(--stroke);
            box-shadow: var(--shadow);
        }

        .progress-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .progress-text {
            color: var(--muted);
            font-size: 0.9em;
        }

        .status-bar {
            display: flex;
            gap: 16px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-correct { color: var(--teal); }
        .status-wrong { color: var(--error); }

        .question-text {
            font-family: var(--font-display);
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .options-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            background-color: #fff;
            border: 1px solid var(--stroke);
            padding: var(--space-4) var(--space-6);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item:hover:not(.selected) {
            background-color: var(--card);
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .option-item.selected.correct {
            background-color: rgba(31, 111, 120, 0.12);
            border-color: var(--teal);
        }

        .option-item.selected.incorrect {
            background-color: rgba(181, 72, 50, 0.12);
            border-color: var(--error);
        }

        .option-label {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feedback-state {
            font-weight: bold;
            font-size: 0.9em;
            display: none;
        }

        .selected .feedback-state {
            display: block;
        }

        .correct .feedback-state { color: var(--teal); }
        .incorrect .feedback-state { color: var(--error); }

        .rationale {
            font-size: 0.95em;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.5;
            display: none;
        }

        .selected .rationale {
            display: block;
        }

        .hint-toggle {
            border: 1px solid var(--stroke);
            color: var(--muted);
            cursor: pointer;
            padding: var(--space-2) var(--space-6);
            border-radius: var(--radius-md);
            background-color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hint-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .hint-content {
            margin-top: 32px;
            padding: var(--space-6);
            background-color: #fff;
            border: 1px solid var(--stroke);
            border-radius: var(--radius-lg);
            font-size: 0.95em;
            color: var(--muted);
            display: none;
            align-items: flex-start;
            gap: 16px;
        }

        .hint-content.active {
            display: flex;
        }

        .hint-icon-box {
            color: var(--accent-dark);
            font-size: 1.2em;
            margin-top: -2px;
        }

        .navigation {
            margin-top: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            border-radius: var(--radius-md);
            padding: var(--space-2) var(--space-7);
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-prev {
            background-color: #fff;
            color: var(--ink);
            border-color: var(--stroke);
        }

        .btn-prev:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn-next {
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            color: #fff;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(23, 23, 23, 0.12);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .hidden { display: none; }

        @media (max-width: 900px) {
            .quiz-container {
                margin: var(--space-8);
                max-width: 100%;
            }
        }

        @media (max-width: 720px) {
            .quiz-container {
                padding: var(--space-8) var(--space-6);
            }

            .question-text {
                font-size: 1.3em;
            }

            .option-item {
                padding: var(--space-4);
            }
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
            }

            .quiz-container {
                margin: var(--space-6);
                padding: var(--space-7) var(--space-5);
            }

            .progress-container {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-3);
            }

            .navigation {
                flex-direction: column;
                align-items: stretch;
                gap: var(--space-4);
            }

            .nav-buttons {
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .hint-toggle {
                justify-content: space-between;
            }
        }
    </style>

        const quizData = [{"answerOptions":[{"isCorrect":false,"rationale":"A memorização é apenas uma faculdade, não correspondendo à raiz latina que foca no processo de seleção.","text":"A capacidade intrínseca de memorizar grandes volumes de dados sem erro."},{"isCorrect":true,"rationale":"A raiz latina 'Inter' (entre) e 'Legere' (escolher) define a inteligência como a capacidade de realizar escolhas.","text":"A habilidade de escolher ou selecionar entre diferentes opções de forma eficiente."},{"isCorrect":false,"rationale":"Este conceito confunde a origem da palavra inteligência com o termo artificial.","text":"A faculdade de criar vida artificial a partir de materiais inorgânicos."},{"isCorrect":false,"rationale":"O foco etimológico está na ação de escolher e não apenas na recepção de sinais sensoriais.","text":"O processamento puramente biológico de estímulos externos em sensores."}],"hint":"Considere a junção dos termos 'Inter' e 'Legere'.","question":"Com base na etimologia latina da palavra 'Inteligência', qual é a interpretação fundamental que sustenta o conceito apresentado no material?"},{"answerOptions":[{"isCorrect":true,"rationale":"A IA forte visa a replicação da mente consciente, enquanto a fraca foca na simulação funcional.","text":"A IA Forte possui consciência real, enquanto a IA Fraca apenas simula o comportamento humano sem autoconsciência."},{"isCorrect":false,"rationale":"Ambas podem usar lógica, mas a diferença reside na profundidade da experiência consciente.","text":"A IA Fraca é capaz de raciocinar logicamente, enquanto a IA Forte depende exclusivamente de algoritmos simbólicos."},{"isCorrect":false,"rationale":"Esta é uma distinção de mercado ou uso histórico, não uma definição conceitual de consciência.","text":"A IA Forte é restrita ao âmbito militar, enquanto a IA Fraca é utilizada em empresas e indústrias."},{"isCorrect":false,"rationale":"O objetivo da IA forte é justamente criar máquinas que pensem verdadeiramente como pessoas.","t m conjuntos difusos e aproximados."},{"isCorrect":false,"rationale":"Agentes racionais buscam a perfeição lógica (racionalidade), não necessariamente a fidelidade ao comportamento humano.","text":"Um agente racional que busca sempre o melhor resultado esperado."}],"hint":"Diferencie entre a fidelidade ao comportamento biológico e a busca pela racionalidade matemática.","question":"De acordo com as dimensões de classificação da IA, uma proposta centrada em humanos é descrita como:"},{"answerOptions":[{"isCorrect":false,"rationale":"Estes algoritmos simulam a seleção natural, não o fluxo de pensamento consciente imediato.","text":"Algoritmos evolucionários."},{"isCorrect":false,"rationale":"Esta é uma técnica estatística de redução dimensional, não de captura de pensamentos.","text":"Análise de componentes principais."},{"isCorrect":true,"rationale":"A introspecção permite tentar determinar como os humanos pensam ao observar o próprio processo mental.","text":"Introspecção."},{"isCorrect":false,"rationale":"Embora simulem neurônios, elas não são o método direto de capturar pensamentos humanos conscientes no momento da ação.","text":"Redes Neurais Artificiais."}],"hint":"É um método de 'olhar para dentro' da própria mente.","question":"Na modelagem cognitiva, qual técnica é citada como forma de capturar os pensamentos à medida que eles surgem?"},{"answerOptions":[{"isCorrect":false,"rationale":"Agentes autônomos precisam atuar mesmo sem informações perfeitas sobre o ambiente.","text":"Ele deve cessar a operação até que dados precisos sejam obtidos."},{"isCorrect":true,"rationale":"A racionalidade em IA é definida pela maximização do desempenho esperado dadas as percepções.","text":"Ele deve agir de forma a alcançar o melhor resultado esperado."},{"isCorrect":false,"rationale":"Esta é uma função específica do programa Eliza, não uma regra geral para agentes racionais.","text":"Ele deve imitar o comportamento de um psicanalista rogeriano."},{"isCorrect":false,"rationale":"O material apresenta dilemas éticos justamente para mostrar que essa escolha não é simples ou predefinida.","text":"Ele deve priorizar a lei sobre a segurança em todos os dilemas éticos."}],"hint":"Foque no conceito de 'resultado esperado' mencionado no texto.","question":"Sobre os 'Agentes Racionais', qual afirmação melhor descreve sua função sob condições de incerteza?"},{"answerOptions":[{"isCorrect":false,"rationale":"As escalas de tempo citadas no material são muito mais extremas.","text":"O cérebro dobra sua capacidade a cada milênio, enquanto chips dobram a cada década."},{"isCorrect":false,"rationale":"Nanosegundos referem-se à velocidade de execução, não ao tempo de evolução da tecnologia.","text":"Chips dobram em nanosegundos e neurônios levam milhões de anos para processar um bit."},{"isCorrect":true,"rationale":"O texto destaca a evolução tecnológica acelerada em comparação com a evolução biológica lenta.","text":"Chips dobram a cada 1 ou 1,5 ano, enquanto o cérebro leva de 2 a 4 milhões de anos para dobrar sua capacidade."},{"isCorrect":false,"rationale":"O material afirma explicitamente que os neurônios são milhões de vezes mais lentos que os chips.","text":"Não há comparação, pois neurônios são milhões de vezes mais rápidos que transistores."}],"hint":"Pense na diferença entre anos e milhões de anos.","question":"Comparando a Neurociência e a Computação, qual é a disparidade temporal mencionada em relação à evolução da capacidade do cérebro humano versus a Lei de Moore?"},{"answerOptions":[{"isCorrect":false,"rationale":"O reconhecimento de imagens é uma tarefa de IA, mas o Teste de Turing é baseado em diálogo textual.","text":"Se ele for capaz de processar imagens de gatos com $100\\%$ de precisão."},{"isCorrect":true,"rationale":"O critério de sucesso é a indistinguibilidade comportamental durante a comunicação indireta.","text":"Se um interrogador humano não conseguir distinguir quem é o humano e quem é a máquina em um diálogo."},{"isCorrect":false,"rationale":"A lógica é fundamental, mas o teste foca na emulação do comportamento humano geral, não apenas logico.","text":"Se a máquina conseguir resolver silogismos aristotélicos complexos."},{"isCorrect":false,"rationale":"O hardware utilizado é irrelevante para o critério de sucesso do Teste de Turing.","text":"Se o sistema utilizar obrigatoriamente redes neurais de 16 mil processadores."}],"hint":"O sucesso depende da percepção de um terceiro elemento no teste.","question":"No Teste de Turing, o que define se um computador 'pensa'?"},{"answerOptions":[{"isCorrect":false,"rationale":"Estas são necessárias para o teste de Turing total, mas as quatro básicas citadas focam no processamento de informações.","text":"Visão computacional, robótica, sensores e atuadores."},{"isCorrect":true,"rationale":"Essas competências permitem a comunicação, o armazenamento, a inferência e a adaptação necessários para o diálogo.","text":"Processamento de linguagem natural, representação de conhecimento, raciocínio automatizado e aprendizado de máquina."},{"isCorrect":false,"rationale":"Estes são algoritmos específicos de machine learning, não capacidades sistêmicas de alto nível.","text":"Regressão linear, árvores de decisão, Naive Bayes e SVM."},{"isCorrect":false,"rationale":"Estes são fundamentos e métodos de estudo da mente, não componentes técnicos do sistema.","text":"Introspecção, experimentos psicológicos, silogismos e lógica."}],"hint":"Três dessas capacidades lidam com dados e linguagem, e uma com a adaptação do sistema.","question":"Quais são as quatro capacidades fundamentais que um sistema precisa ter para passar no Teste de Turing, segundo o material?"},{"answerOptions":[{"isCorrect":true,"rationale":"Generalizar significa aplicar o conhecimento aprendido em dados novos e não vistos anteriormente.","text":"Maximizar a capacidade de generalização de seu aprendiz."},{"isCorrect":false,"rationale":"Sensores e atuadores são partes da interface com o ambiente, não o desafio do algoritmo de aprendizagem.","text":"Eliminar completamente a necessidade de sensores e atuadores."},{"isCorrect":false,"rationale":"Criatividade e estética podem ser subprodutos, mas o desafio técnico é a precisão e generalização.","text":"Garantir que todos os movimentos sejam 'bonitos' e criativos como no AlphaGo."},{"isCorrect":false,"rationale":"A velocidade é uma questão de hardware e otimização, não o desafio teórico central do aprendizado.","text":"Reduzir o poder computacional para menos de nanosegundos."}],"hint":"Considere o que acontece quando o sistema encontra dados que nunca viu antes.","question":"Qual é o principal desafio dos algoritmos de Aprendizado de Máquina (Machine Learning)?"},{"answerOptions":[{"isCorrect":false,"rationale":"Heurísticas não garantem soluções exatas; para isso usa-se algoritmos determinísticos.","text":"Quando o sistema precisa de uma resposta exata e certificada matematicamente."},{"isCorrect":true,"rationale":"Em problemas de alta complexidade (explosão combinatória), é inviável investigar todas as opções.","text":"Quando o número de possibilidades de solução se torna impossível de ser processado integralmente."},{"isCorrect":false,"rationale":"Lógica de predicados pode ser resolvida sem heurísticas se o espaço de busca for pequeno.","text":"Sempre que o sistema utiliza lógica de predicados e regras de produção."},{"isCorrect":false,"rationale":"Heurísticas são aplicadas em uma vasta gama de problemas complexos, como no exemplo da floresta.","text":"Apenas em sistemas de reconhecimento de gatinhos no YouTube."}],"hint":"Pense sobre a escala de possibilidades de um problema.","question":"Em que situação o uso de Heurísticas se torna a 'única possibilidade' para resolver um problema?"},{"answerOptions":[{"isCorrect":false,"rationale":"Esta denominação pertence à abordagem simbólica.","text":"Descendente ou cognitiva."},{"isCorrect":false,"rationale":"A abordagem evolucionária é uma categoria distinta focada em populaç plicitamente listado como um algoritmo de aprendizado de máquina.","text":"KNN (K-vizinhos mais próximos)."}],"hint":"Diferencie conceitos lógicos da antiguidade de algoritmos computacionais modernos.","question":"Qual destes algoritmos NÃO é listado como pertencente à linha de Aprendizagem de Máquina no material?"},{"answerOptions":[{"isCorrect":false,"rationale":"Este é um processo de fabricação de hardware (Lei de Moore), não uma capacidade intrínseca do agente.","text":"Aumento manual de transistores por polegada quadrada."},{"isCorrect":true,"rationale":"A capacidade de aprender é um dos pilares que permite ao agente evoluir sua eficiência.","text":"Aprendizado e uso do conhecimento adquirido."},{"isCorrect":false,"rationale":"Sensores e atuadores têm funções diferentes; um não substitui o outro para melhorar desempenho.","text":"Substituição completa de seus atuadores por sensores."},{"isCorrect":false,"rationale":"Agentes inteligentes dependem da observação do ambiente através de sensores para agir corretamente.","text":"Uso exclusivo de introspecção sem sensores externos."}],"hint":"Pense na função de 'Machine Learning' aplicada a agentes.","question":"Segundo o material, os 'Agentes Inteligentes' podem possuir a capacidade de melhorar seu desempenho através de qual processo?"},{"answerOptions":[{"isCorrect":false,"rationale":"Este foi um detalhe técnico de um experimento específico do Google.","text":"Simular o cérebro humano com exatamente 16 mil processadores."},{"isCorrect":true,"rationale":"A lógica fuzzy permite lidar com termos imprecisos da linguagem humana no âmbito matemático.","text":"Ser adequada para interpretações linguísticas que facilitam modelos matemáticos."},{"isCorrect":false,"rationale":"Problemas bem definidos são o foco da abordagem simbólica, enquanto a fuzzy lida com a imprecisão.","text":"Funcionar apenas em problemas bem definidos através de regras de manipulação."},{"isCorrect":false,"rationale":"As abordagens fuzzy e rough sets são desenvolvimentos teóricos posteriores ao período da guerra.","text":"Basear-se estritamente na quebra de códigos da Segunda Guerra Mundial."}],"hint":"Associe o termo 'difuso' ou 'nebuloso' com a linguagem.","question":"Qual é a característica fundamental da abordagem de 'Conjuntos Difusos' (Fuzzy Sets)?"},{"answerOptions":[{"isCorrect":false,"rationale":"A Lei de Moore fala sobre densidade de transistores, não sobre a durabilidade física dos componentes.","text":"Construir chips que durem mais que 1,5 ano."},{"isCorrect":true,"rationale":"Sem entender como a inteligência natural funciona, é difícil criar um modelo para implementação computacional.","text":"Determinar o mecanismo usado pelos seres inteligentes."},{"isCorrect":false,"rationale":"Este foi um desafio técnico resolvido, não a maior dificuldade fundamental da área toda.","text":"Encontrar gatinhos no YouTube sem usar processadores."},{"isCorrect":false,"rationale":"A tradução etimológica é simples; a modelagem da inteligência é o verdadeiro obstáculo.","text":"Traduzir o latim 'Inter Legere' para o inglês."}],"hint":"Pense no passo necessário antes da implementação bem-sucedida em um computador.","question":"A maior dificuldade da área de IA, segundo o material, consiste em:"}];
        let currentIndex = 0;
        const state = quizData.map(() => ({ selectedIndex: null, hintVisible: false }));

        function renderQuestion() {
            const q = quizData[currentIndex];
            const s = state[currentIndex];
            const content = document.getElementById('quiz-content');
            
            let optionsHtml = '';
            q.answerOptions.forEach((opt, idx) => {
                const isSelected = s.selectedIndex === idx;
                const statusClass = isSelected ? (opt.isCorrect ? 'correct' : 'incorrect') : '';
                const selectedClass = isSelected ? 'selected' : '';
                
                optionsHtml += `
                    <li class="option-item ${selectedClass} ${statusClass}" onclick="selectOption(${idx})">
                        <div class="option-label">
                            <span>${String.fromCharCode(65 + idx)}. ${opt.text}</span>
                        </div>
                        <div class="feedback-state">
                            ${opt.isCorrect ? '✓ Right answer' : '✕ Not quite'}
                        </div>
                        ${opt.rationale ? '<div class="rationale">' + opt.rationale + '</div>' : ''}
                    </li>
                `;
            });

            const correctCount = state.filter((s, i) => s.selectedIndex !== null && quizData[i].answerOptions[s.selectedIndex].isCorrect).length;
            const wrongCount = state.filter((s, i) => s.selectedIndex !== null && !quizData[i].answerOptions[s.selectedIndex].isCorrect).length;

            content.innerHTML = `
                <div class="progress-container">
                    <div class="progress-text">${currentIndex + 1} / ${quizData.length}</div>
                    <div class="status-bar">
                        <div class="status-item status-correct">
                            <span>✓</span>
                            <span>${correctCount}</span>
                        </div>
                        <div class="status-item status-wrong">
                            <span>✕</span>
                            <span>${wrongCount}</span>
                        </div>
                    </div>
                </div>
                <div class="question-text">${q.question}</div>
                <ul class="options-list">
                    ${optionsHtml}
                </ul>
            `;

            // Update Hint Box
            const hintBox = document.getElementById('hint-box');
            const hintText = document.getElementById('hint-text');
            hintText.innerText = q.hint || 'No hint available for this question.';
            if (s.hintVisible) {
                hintBox.classList.add('active');
            } else {
                hintBox.classList.remove('active');
            }

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === quizData.length - 1;
            document.getElementById('hint-icon-arrow').innerText = s.hintVisible ? '▲' : '▼';
        }

        function selectOption(idx) {
            if (state[currentIndex].selectedIndex !== null) return; // Prevent re-selection
            state[currentIndex].selectedIndex = idx;
            renderQuestion();
        }

        function toggleHint() {
            state[currentIndex].hintVisible = !state[currentIndex].hintVisible;
            renderQuestion();
        }

        document.getElementById('prev-btn').onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        };

        document.getElementById('next-btn').onclick = () => {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        };

        document.getElementById('hint-toggle').onclick = toggleHint;

        renderQuestion();
    </script>
